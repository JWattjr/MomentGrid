[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.29"
optimizer = true
optimizer_runs = 200

# ScoringParity.t.sol reads the golden vectors the TypeScript package generates.
fs_permissions = [{ access = "read", path = "../shared/fixtures" }]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}"
anvil = "http://127.0.0.1:8545"

[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
